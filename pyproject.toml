[project]
name = "companies-house-neo4j-python"
authors = [
    { name = "Angelos Panagiotopoulos", email = "angelospanag@protonmail.com" },
]
version = "0.1.0"
description = "A proof of concept app that stores the full graph network (officers, persons with significant control) of a UK company in Neo4j using the Companies House Public Data API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "neo4j>=5.28.2",
    "pydantic-settings>=2.14.1",
    "pydantic>=2.11.7",
    "requests>=2.32.5",
    "typer>=0.20.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.16", "ty>=0.0.43"]

[tool.ruff]
lint.select = [
    "E",
    "W",
    "F",
    "B",
    "I",
    "N",
    "SIM",
    "UP",
    "PERF",
    "RET",
    "RSE",
]
