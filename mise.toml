[tools]
python = "3.15.2"
uv = "0.13.7"

[tasks.fmt]
description = "✨ Format code with ruff"
run = "uv run ruff format"

[tasks.lint]
description = "🔍 Lint code with ruff"
run = "uv run ruff check"

[tasks.typecheck]
description = "🧐 Type check with ty"
run = "uv run ty check src/ main.py"

[tasks.vuln]
description = "🛡️ Audit dependencies for known vulnerabilities"
run = "uv audit"

[tasks.install]
description = "📦 Install dependencies into .venv from lockfile"
run = "uv sync"

[tasks.test]
description = "🧪 Run tests"
run = "uv run pytest"

[tasks.deps]
description = "📥 Update and sync dependencies"
run = "uv sync -U"
